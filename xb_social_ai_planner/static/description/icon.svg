<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.55" stop-color="#A21CAF"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1E9FF"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#3B0764" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="140" height="140" rx="32" fill="url(#bg)"/>
  <circle cx="104" cy="34" r="46" fill="#FFFFFF" opacity="0.10"/>

  <!-- stacked scheduled-post cards -->
  <g filter="url(#sh)">
    <rect x="34" y="48" width="64" height="64" rx="12" fill="#C4B5FD" opacity="0.55" transform="rotate(-9 66 80)"/>
    <rect x="40" y="44" width="64" height="64" rx="12" fill="url(#card)"/>
  </g>
  <!-- card content: header bar + lines + image chip -->
  <rect x="48" y="52" width="34" height="6" rx="3" fill="#A21CAF"/>
  <rect x="48" y="64" width="48" height="5" rx="2.5" fill="#CBB7E6"/>
  <rect x="48" y="74" width="40" height="5" rx="2.5" fill="#CBB7E6"/>
  <rect x="48" y="88" width="48" height="16" rx="5" fill="#EC4899" opacity="0.85"/>

  <!-- AI sparkle -->
  <g transform="translate(99 47)">
    <path d="M0 -17 L4.4 -4.4 L17 0 L4.4 4.4 L0 17 L-4.4 4.4 L-17 0 L-4.4 -4.4 Z" fill="#FBBF24"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
  </g>
  <path d="M26 30 L28.4 35.6 L34 38 L28.4 40.4 L26 46 L23.6 40.4 L18 38 L23.6 35.6 Z" fill="#FFFFFF" opacity="0.9"/>
</svg>
